services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - complaint-management-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://127.0.0.1:27017/admin",
          "--eval",
          "db.runCommand({ ping: 1 }).ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: complaint-management-backend:local
    build:
      context: ./server
      dockerfile: Dockerfile
      tags:
        - complaint-management-backend:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/complaint-management-system
    ports:
      - "${BACKEND_HOST_PORT:-5001}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      default:
        aliases:
          - complaint-backend

  frontend:
    image: complaint-management-frontend:local
    build:
      context: ./client
      dockerfile: Dockerfile
      tags:
        - complaint-management-frontend:${APP_VERSION:-0.1.0}
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  complaint-management-mongo-data:
