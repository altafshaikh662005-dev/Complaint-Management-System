apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaint-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: complaint-frontend
  template:
    metadata:
      labels:
        app: complaint-frontend
    spec:
      containers:
        - name: frontend
          image: complaint-management-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: complaint-frontend
spec:
  selector:
    app: complaint-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
